name: Catalog watch

# Weekly: checks every provider's docs and Terraform address, and opens a PR when something moved,
# disappeared or changed. Moved docs URLs are fixed in the PR; the rest is listed for review.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun scripts/watch-catalog.ts --report "$RUNNER_TEMP/catalog-report.md"
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: catalog/watch
          delete-branch: true
          add-paths: |
            packages/cli/src/catalog/saas.json
            packages/cli/src/catalog/watch.json
          commit-message: "Catalog: record this week's provider site check"
          title: "Catalog: provider sites changed"
          body-path: ${{ runner.temp }}/catalog-report.md
          labels: catalog
